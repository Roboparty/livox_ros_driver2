name: Build Livox ROS Driver 2 Deb Package

on:
  push:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: arm64
            os: [self-hosted, Linux, ARM64, "24.04"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Tag vs changelog version check
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          CHANGELOG_VERSION=$(head -1 debian/changelog | grep -oP '\((.*?)\)' | tr -d '()' | cut -d'-' -f1)

          echo "Tag version:       $TAG_VERSION"
          echo "Changelog version: $CHANGELOG_VERSION"

          if [ "$TAG_VERSION" != "$CHANGELOG_VERSION" ]; then
            echo "::error::Version mismatch! tag=v$TAG_VERSION, changelog=$CHANGELOG_VERSION"
            exit 1
          fi

          echo "✅ Tag matches changelog: v$TAG_VERSION"

      - name: Setup ROS 2 Jazzy
        if: matrix.arch == 'amd64'
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config ccache dpkg-dev debhelper devscripts \
            git python3-colcon-common-extensions \
            libpcl-dev libapr1-dev \
            ros-jazzy-ament-cmake-auto ros-jazzy-rclcpp \
            ros-jazzy-rclcpp-components ros-jazzy-std-msgs \
            ros-jazzy-sensor-msgs ros-jazzy-rcl-interfaces \
            ros-jazzy-rcutils ros-jazzy-pcl-conversions \
            ros-jazzy-rosbag2 ros-jazzy-rosidl-default-generators \
            ros-jazzy-rosidl-default-runtime

      - name: Build and install Livox SDK2
        run: |
          rm -rf /tmp/Livox-SDK2
          git clone --depth 1 https://github.com/Roboparty/Livox-SDK2.git /tmp/Livox-SDK2
          cd /tmp/Livox-SDK2
          dpkg-buildpackage -us -uc -b
          sudo dpkg -i ../livox-sdk2_*.deb ../livox-sdk2-dev_*.deb

      - name: Build deb package
        run: |
          . /opt/ros/jazzy/setup.sh
          dpkg-buildpackage -us -uc -b
          mv ../*.deb .
          VERSION=$(dpkg-parsechangelog -S Version | cut -d'-' -f1 || echo "unknown")
          echo "PKG_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: livox-ros-driver2-v${{ env.PKG_VERSION }}-${{ matrix.arch }}
          path: "*.deb"

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.deb"
